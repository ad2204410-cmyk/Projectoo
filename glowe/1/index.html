<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOWE - Directorio Skincare</title>
    <style>
        /* Estilos generales con colores sólidos (sin gradientes) */
        body {
            font-family: Arial, sans-serif;
            background-color: #FAF3F0; /* Fondo beige muy suave */
            color: #333333;            /* Texto gris oscuro */
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #E8A598; /* Color sólido salmón/rosa palo */
            color: #FFFFFF;
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 4px;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Estilo de los botones/enlaces */
        .lista-tiendas {
            list-style: none;
            padding: 0;
        }

        .lista-tiendas li {
            margin: 15px 0;
        }

        .lista-tiendas a {
            display: block;
            background-color: #FFFFFF;
            color: #333333;
            text-decoration: none;
            padding: 15px;
            border: 2px solid #E8A598;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
        }

        /* Cambio de color sólido al pasar el mouse */
        .lista-tiendas a:hover {
            background-color: #E8A598;
            color: #FFFFFF;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            font-size: 0.9em;
            color: #777777;
        }
    </style>
</head>
<body>

    <header>
        <h1>GLOWE</h1>
        <p>Tu guía rápida a las mejores tiendas de skincare</p>
    </header>

    <main>
        <h2>Explora tiendas recomendadas</h2>
        <p>Haz clic en cualquiera de los enlaces para ir a su tienda oficial:</p>

        <ul class="lista-tiendas">
            <li><a href="https://www.sephora.com" target="_blank">Sephora</a></li>
            <li><a href="https://theordinary.com" target="_blank">The Ordinary</a></li>
            <li><a href="https://www.cerave.com" target="_blank">CeraVe</a></li>
            <li><a href="https://www.laroche-posay.com" target="_blank">La Roche-Posay</a></li>
            <li><a href="https://www.ulta.com" target="_blank">Ulta Beauty</a></li>
        </ul>
    </main>

    <footer>
        <p>&copy; 2026 GLOWE. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
